<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gitcitybanner</title>
    <meta
      name="description"
      content="Transforme os últimos 365 dias de contribuições de um perfil do GitHub em um banner de cidade noturna."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body class="page-landing page-generator">
    <header class="site-header shell">
      <a class="site-title" href="../" data-i18n="title">gitcitybanner</a>
      <nav class="lang-switch" aria-label="Idioma" data-i18n-aria-label="langSwitchLabel">
        <span data-i18n="langPt" aria-current="true">PT</span>
        <span class="lang-switch__separator" aria-hidden="true">·</span>
        <a href="../en/generate/" hreflang="en" data-i18n="langEn">EN</a>
      </nav>
    </header>

    <main class="generator shell">
      <section class="generator__intro">
        <p class="eyebrow" data-i18n="generatorEyebrow">Gerador</p>
        <h1 class="generator__title" data-i18n="generatorTitle">Gere a sua cidade.</h1>
        <p class="lead generator__lead" data-i18n="tagline">
          Transforme os últimos 365 dias de contribuições de um perfil do GitHub em um banner de cidade
          noturna, pronto para baixar em PNG.
        </p>
      </section>

      <div id="app"></div>

      <section id="preview" class="preview" aria-live="polite">
        <p class="preview__hint" data-i18n="previewEmpty">
          O banner aparece aqui depois que você gerar.
        </p>
        <canvas class="preview__canvas" width="1500" height="500" hidden></canvas>
        <div id="downloads" class="preview__actions" hidden></div>
      </section>
    </main>

    <footer class="site-footer shell">
      <p data-i18n="footer">Projeto open source. Nenhum dado é armazenado.</p>
    </footer>

    <script type="module" src="../app.ts"></script>
  </body>
</html>
