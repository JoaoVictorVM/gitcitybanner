<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gitcitybanner</title>
    <meta
      name="description"
      content="Turn the last 365 days of a GitHub profile's contributions into a night-city banner."
    />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
    <link rel="stylesheet" href="../../styles/main.css" />
  </head>
  <body>
    <header class="site-header shell">
      <a class="site-title" href="../" data-i18n="title">gitcitybanner</a>
      <nav class="lang-switch" aria-label="Language" data-i18n-aria-label="langSwitchLabel">
        <a href="../../gerar/" hreflang="pt-BR" data-i18n="langPt">PT</a>
        <span class="lang-switch__separator" aria-hidden="true">·</span>
        <span data-i18n="langEn" aria-current="true">EN</span>
      </nav>
    </header>

    <main class="site-main shell">
      <h1 class="page-title" data-i18n="generateButtonLabel">Generate banner</h1>
      <p class="tagline" data-i18n="tagline">
        Turn the last 365 days of a GitHub profile's contributions into a night-city banner, ready to
        download as a PNG.
      </p>

      <div id="app"></div>

      <section id="preview" class="preview" aria-live="polite">
        <p class="preview__hint" data-i18n="previewEmpty">
          Your banner shows up here once you generate it.
        </p>
        <canvas class="preview__canvas" width="1500" height="500" hidden></canvas>
        <div id="downloads" class="preview__actions" hidden></div>
      </section>
    </main>

    <footer class="site-footer shell">
      <p data-i18n="footer">Open source project. No data is stored.</p>
    </footer>

    <script type="module" src="../../app.ts"></script>
  </body>
</html>
